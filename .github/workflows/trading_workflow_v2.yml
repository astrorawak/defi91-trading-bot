name: DeFi91 Trading Bot

on:
  schedule:
    # Jadwal jam volatilitas tinggi crypto (semua dalam UTC):
    # Sesi Asia
    - cron: '0 0 * * 0'   # 07:00 WIB (Minggu) - Weekly Insights Telegram
    - cron: '0 0 * * *'   # 07:00 WIB - Daily Report Telegram
    - cron: '0 1 * * *'   # 08:00 WIB - Asia market open
    - cron: '30 2 * * *'  # 09:30 WIB - Asia momentum peak
    # Sesi London
    - cron: '0 7 * * *'   # 14:00 WIB - London open
    - cron: '30 8 * * *'  # 15:30 WIB - London momentum
    # Sesi New York
    - cron: '0 13 * * *'  # 20:00 WIB - NY open (volatilitas tertinggi)
    - cron: '30 14 * * *' # 21:30 WIB - NY momentum peak
    # Overlap & larut malam
    - cron: '0 16 * * *'  # 23:00 WIB - Late NY
    - cron: '0 19 * * *'  # 02:00 WIB - Asia late night
    - cron: '0 22 * * *'  # 05:00 WIB - Pre-Asia open
  workflow_dispatch:

# Cegah dua run bertabrakan. Tanpa ini, dua workflow bisa membaca posisi yang
# sama lalu sama-sama membuka trade, atau saling menimpa trades.json.
concurrency:
  group: defi91-trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Gerbang keselamatan: kalau kode tidak bisa dikompilasi atau tesnya
      # gagal, JANGAN biarkan bot menyentuh uang sungguhan. Bot ini pernah
      # mati berminggu-minggu karena SyntaxError yang tidak pernah ketahuan.
      - name: Sanity check (syntax + tes indikator)
        run: |
          python -m compileall -q .
          python tests/test_indicators.py

      - name: Run Trading Bot
        env:
          HYPERLIQUID_ADDRESS: ${{ secrets.HYPERLIQUID_ADDRESS }}
          HYPERLIQUID_PRIVATE_KEY: ${{ secrets.HYPERLIQUID_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MARGIN_PER_TRADE: ${{ vars.MARGIN_PER_TRADE }}
          TARGET_LEVERAGE: ${{ vars.TARGET_LEVERAGE }}
          TP_PERCENT: ${{ vars.TP_PERCENT }}
          SL_PERCENT: ${{ vars.SL_PERCENT }}
          ENTRY_THRESHOLD: ${{ vars.ENTRY_THRESHOLD }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS }}
          DAILY_LOSS_LIMIT: ${{ vars.DAILY_LOSS_LIMIT }}
          MAX_DRAWDOWN_PERCENT: ${{ vars.MAX_DRAWDOWN_PERCENT }}
          MAX_CONSECUTIVE_LOSSES: ${{ vars.MAX_CONSECUTIVE_LOSSES }}
          MIN_ACCOUNT_BALANCE: ${{ vars.MIN_ACCOUNT_BALANCE }}
        run: python github_bot_v2.py

      - name: Run Grid Bot
        env:
          HYPERLIQUID_ADDRESS: ${{ secrets.HYPERLIQUID_ADDRESS }}
          HYPERLIQUID_PRIVATE_KEY: ${{ secrets.HYPERLIQUID_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRID_ENABLED: ${{ vars.GRID_ENABLED }}
          GRID_CANDIDATES: ${{ vars.GRID_CANDIDATES }}
          GRID_TOTAL_BUDGET: ${{ vars.GRID_TOTAL_BUDGET }}
          MIN_ACCOUNT_BALANCE: ${{ vars.MIN_ACCOUNT_BALANCE }}
        run: python grid_bot.py

      - name: Commit and push data
        run: |
          git config --local user.email "bot@defi91.local"
          git config --local user.name "DeFi91 Bot"
          git add trades.json performance.json market_regime.json grid_trades.json risk_state.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git commit -m "Auto: Update trades - $(date '+%Y-%m-%d %H:%M')"
          # Rebase dulu supaya tidak bentrok dengan workflow lain yang juga
          # push ke branch ini. Versi lama memakai `git push || true`, jadi
          # kegagalan push tidak terlihat dan datanya hilang diam-diam.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push gagal (percobaan $i), ulangi..."
            sleep $((i * 5))
          done
          echo "::error::Gagal push data trading setelah 3 percobaan"
          exit 1

      - name: Send Daily Telegram Report
        if: github.event.schedule == '0 0 * * *' || github.event.schedule == '0 0 * * 0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_reporter.py
          if [ "$(date +'%u')" = "7" ]; then
            python weekly_insights.py
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
